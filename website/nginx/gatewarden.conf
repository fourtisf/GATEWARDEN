# Nginx site for Gatewarden (Hostinger VPS).
# 1) Upload the contents of site/ to /var/www/gatewarden   (or use the GitHub Action "Deploy web (VPS)")
# 2) Copy this file to /etc/nginx/sites-available/gatewarden, replace YOUR_DOMAIN, then:
#      sudo ln -s /etc/nginx/sites-available/gatewarden /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#      sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN      # free HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/gatewarden;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "gamepad=(self), fullscreen=(self)" always;

    # Always fetch the latest game + config
    location = /index.html { expires -1; }
    location = /config.js  { expires -1; }

    # Long cache for fonts and images
    location /fonts/  { expires 1y;  access_log off; }
    location /assets/ { expires 30d; access_log off; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
