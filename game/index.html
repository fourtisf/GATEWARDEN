:root{

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg0);color:var(--text);font-family:'Outfit',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 20% 10%,rgba(139,108,255,.16),transparent 60%),radial-gradient(900px 600px at 85% 90%,rgba(62,242,208,.1),transparent 60%),var(--bg0)}
#stage{position:relative;width:1600px;height:900px;flex:none;transform-origin:center center;overflow:hidden;border-radius:0;background:#0a1426;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px var(--line)}

.hud{position:absolute;z-index:5;pointer-events:none}

#hudTL{left:16px;top:14px;width:400px;padding:10px 12px;display:flex;gap:10px;align-items:center}

.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:6px}

#hpFill{background:linear-gradient(90deg,#ff5fa2,#ff9cc2)}

#hudTC{left:50%;top:14px;transform:translateX(-50%);width:430px;padding:9px 16px 8px;text-align:center}
#waveLbl{font-family:'Silkscreen',monospace;font-size:20px;color:#fff;letter-spacing:2px;margin-bottom:6px}
#timerFill{background:linear-gradient(90deg,#3ef2d0,#5cc8ff)}
#timerFill.boss{background:linear-gradient(90deg,#ff5fa2,#8b6cff)}

.stat{display:flex;align-items:center;gap:7px;font-family:'Silkscreen',monospace;font-size:19px;padding:5px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--coin)}

.ibtn{pointer-events:auto;font-family:'Silkscreen',monospace;font-size:14px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:10px;height:34px;min-width:42px;padding:0 10px;cursor:pointer;transition:.15s}

.btn{border:none;cursor:pointer;font-family:'Silkscreen',monospace;color:#04161c;border-radius:14px;transition:transform .1s,filter .15s,box-shadow .15s}

.lvTitle{font-family:'Silkscreen',monospace;font-size:52px;letter-spacing:4px;color:#fff;text-shadow:0 0 30px rgba(139,108,255,.9),0 5px 0 rgba(0,0,0,.35);animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.cards{display:grid;gap:16px;margin-top:20px}
.card{position:relative;padding:24px 16px 18px;border-radius:18px;background:linear-gradient(180deg,rgba(42,52,124,.95),rgba(20,26,74,.97));border:2px solid var(--rc);cursor:pointer;transition:transform .15s,box-shadow .15s;animation:cardIn .35s ease backwards}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 40px -12px var(--rc)}

.card .ci{font-size:44px;width:82px;height:82px;margin:0 auto 10px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,.03))}
.card .cn{font-weight:800;font-size:18px}

.card .cr{position:absolute;right:12px;top:13px;font-family:'Silkscreen',monospace;font-size:10px;color:var(--rc);letter-spacing:1px}
/* shop */
.shop{width:1240px;text-align:left;padding:24px 28px}
.shopHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

.shopRow{display:flex;gap:10px;margin-top:12px}
.sbtn{flex:1;height:42px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--text);font-family:'Silkscreen',monospace;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}

.syns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

.trainRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.statLine{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

let HSC=null;
function hs(){
  if(HSC&&HSC.t===F.t)return HSC.v;
  const H=HEROES[S.hero], hr=F.hero, pm=P.perm, W=WEAP[H.weapon];
  const ml=mLevel(S.hero);
  let maxHp=(H.hp+30*cl('vital')+15*S.train.hp+12*pm.vigor)*(has('giant')?1.5:1)*(1+(ml>=4?0.1:0)+(ml>=9?0.1:0))*(modOn('glass')?0.6:1)*(cl('glass')?0.7:1);
  let atk=H.atk*(1+0.2*cl('blade'))*(1+0.03*Math.max(0,S.wave-1))*(1+0.08*S.train.atk)*(1+0.06*pm.might)*(1+(ml>=2?0.05:0)+(ml>=7?0.05:0))*(modOn('glass')?1.6:1)*(cl('glass')?1.7:1)*(F.buff&&F.buff.fury>0?1.6:1)*(F.inWell?1.3:1);
  let bp=0;if(hr&&F.banners)for(const b of F.banners)if(Math.hypot(hr.x-b.x,(hr.y-b.y)*1.3)<b.r)bp=Math.max(bp,b.pow);
  const buffed=bp>0;atk*=1+bp;
  if(has('berserk')&&hr&&hr.hp<hr.maxHp*0.5)atk*=1.35;
  const v={maxHp,atk,buffed,cd:W.cd/(1+0.15*cl('speed'))/(1+bp*0.75)/(F.buff&&F.buff.haste>0?1.3:1),range:W.range*(1+0.18*cl('reach')),area:1+0.18*cl('reach'),spd:H.spd*(1+0.1*cl('fleet'))*(1+0.04*pm.swift)*(modOn('haste')?1.2:1)*(F.buff&&F.buff.haste>0?1.35:1)*(F.onIce?1.3:1)*(F.heroSlow>0?0.65:1),
    crit:0.05+(H.crit||0)+0.08*cl('crit')+(has('edge')?0.2:0),critMul:(has('edge')?2.5:2)+0.6*cl('hs'),leech:0.02*cl('leech')+(has('vamp')?0.06:0),
    taken:Math.pow(0.9,cl('skin'))*(H.armor||1),magnet:has('magnetc')?3000:90*(1+0.4*cl('magnet')),heavyEvery:Math.max(2,W.heavy-cl('whirl'))};
  HSC={t:F.t,v};return v;
}

const MUS={gain:null,track:null,step:0,nextT:0,timer:null,
  init(){if(!AU.ctx||this.gain)return;this.gain=AU.ctx.createGain();this.gain.gain.value=musVol()*0.45;this.gain.connect(AU.out);},
  note(m){return 440*Math.pow(2,(m+(this.tr||0)-69)/12);},
  voice(f,t,d,type,v,cut){const c=AU.ctx;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);let n=o;if(cut){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);n=fl;}n.connect(g);g.connect(this.gain);o.start(t);o.stop(t+d+0.05);},
  drum(kind,t){const c=AU.ctx;
    if(kind==='k'){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);g.gain.setValueAtTime(0.55,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);o.connect(g);g.connect(this.gain);o.start(t);o.stop(t+0.2);return;}
    if(!this.nb){const b=c.createBuffer(1,c.sampleRate*0.3,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;}
    const len=kind==='s'?0.14:0.035,s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type=kind==='s'?'bandpass':'highpass';f.frequency.value=kind==='s'?1800:7000;const g=c.createGain();g.gain.setValueAtTime(kind==='s'?0.26:0.07,t);g.gain.exponentialRampToValueAtTime(0.0001,t+len);s.connect(f);f.connect(g);g.connect(this.gain);s.start(t);s.stop(t+len+0.02);},
  play(name){if(!AU.ctx)return;this.init();if(this.track===name)return;this.track=name;this.step=0;this.nextT=AU.ctx.currentTime+0.08;if(!this.timer)this.timer=setInterval(()=>this.tick(),40);},
  tick(){if(!this.track||!AU.ctx||musVol()<=0.001)return;const T=TRACKS[this.track];const spb=60/(T.bpm*(this.bm||1))/4;if(this.nextT<AU.ctx.currentTime-0.5)this.nextT=AU.ctx.currentTime+0.05;while(this.nextT<AU.ctx.currentTime+0.2){this.sched(T,this.step,this.nextT,spb);this.step++;this.nextT+=spb;}},

  }

const OL='#0a0d26';
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function fs(c,fill,lw=2.4){c.fillStyle=fill;c.fill();c.lineWidth=lw;c.strokeStyle=OL;c.stroke();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,Math.PI*2);}
function starPath(c,x,y,R,r,n=5){c.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rad=i%2?r:R;c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}c.closePath();}
function drawStar(c,x,y,R,fill){starPath(c,x,y,R,R*0.45);c.fillStyle=fill;c.fill();c.lineWidth=1.2;c.strokeStyle=OL;c.stroke();}
function glow(c,col,b){c.shadowColor=col;c.shadowBlur=b;}
function noGlow(c){c.shadowBlur=0;}

function hitEnemy(e,dmg,src,o){
  if(!e.alive)return 0;

  if(d.shield&&o.dir!==undefined&&!e.stun&&!e.frozen&&Math.cos(o.dir)*e.face<-0.15){dmg*=0.25;if(AU.thr('blkt',120))floatText(e.x,e.y-e.h*e.sc-10,'BLOCK','#c9d3f2',12,.5);AU.block();burst(e.x+e.face*16,e.y-30,'#e9f2ff',3,90);}
  if(e.affix==='armored')dmg*=0.5;
  e.hp-=dmg;e.flash=1;
  const big=dmg>=Math.max(30,e.maxHp*0.3)||o.crit;
  if(P.settings.numbers&&(HERO_SRC.has(src)&&src!=='fire'||big))floatText(e.x+rand(-10,10),e.y-e.h*e.sc*(e.elite?1.35:1)-6,Math.round(dmg),o.crit?'#ff5fa2':src==='unit'?'#ffffff':'#bffff3',o.crit?20:(src==='hero'?15:12),.7);
  if(o.kb&&e.alive&&!e.boss&&!e.dashing&&!d.nest){const heavy=d.heavy;const kb=o.kb*(heavy?0.3:1)*(e.elite?0.5:1);e.x+=Math.cos(o.ang)*kb;e.y+=Math.sin(o.ang)*kb*0.6;if(!heavy&&o.stun)e.stun=Math.max(e.stun,o.stun);else if(heavy&&o.heavyHit&&o.stun)e.stun=Math.max(e.stun,o.stun*0.4);}
  if(src!=='hero'&&src!=='wave')AU.hit();

  return dmg;
}

/* ================= spawning ================= */
const THEMES={bat:'Bat swarm — they dive straight at you!',wolf:'Wolf packs are hunting you!',slime:'Slime tide — they split when slain.',skel:'Bone archers — close the distance!',bomber:'Boomshrooms — pop them away from the Gate!',brute:'Orc warband — heavy hitters incoming.',charger:'Tusker stampede — sidestep the charge!',shield:'Shield wall — strike them from behind.',shaman:'Hex coven — kill the healers first!'};
function basePool(w){return {goblin:10,bat:w>=2?5:3,slime:w>=2?3:0,wolf:w>=3?4.5:w>=2?2.5:0,skel:w>=3?4:0,bomber:w>=3?2.6:0,brute:w>=4?2+w*0.1:0,charger:w>=5?1.8:0,shield:w>=6?2.2:0,shaman:w>=7?1.4:0};}
function spawnPool(w){const p=basePool(w),b=MAPS[scn()].bias;if(b)for(const k in b)if(p[k])p[k]*=b[k];const ex=MAPS[scn()].extra;if(ex)for(const k in ex)if(w>=ex[k][0])p[k]=ex[k][1];if(WV&&WV.theme&&p[WV.theme])p[WV.theme]=p[WV.theme]*3+4;return p;}
function pickTheme(w){if(w<3||bossFor(w))return null;const p=basePool(w),ks=Object.keys(THEMES).filter(k=>p[k]>0&&k!==S.lastTheme);const k=ks[Math.floor(Math.random()*ks.length)]||null;S.lastTheme=k;return k;}
function edgePoint(side){
  const r=side!==undefined?side:Math.random();
  if(r<0.36)return {x:CORE.x-SPX,y:CORE.y+rand(-SPY+60,SPY-60)};
  if(r<0.72)return {x:CORE.x+SPX,y:CORE.y+rand(-SPY+60,SPY-60)};
  if(r<0.86)return {x:CORE.x+rand(-SPX+150,SPX-150),y:CORE.y-SPY};

    cdT:rand(0,.6),range:d.range,spd:d.spd*rand(.9,1.1),alive:true,flash:0,atkAnim:0,anim:rand(0,6),face:x<CORE.x?1:-1,boss:!!d.boss,moving:true,frozen:0,stun:0,elite:false,oc:0,
    patT:2.5,patI:0,busy:0,chT:rand(1,2.5),state:null,slowT:0,taunt:0,wander:rand(0,Math.PI*2),life:d.treasure?14:0};

function spawnTick(h){
  const w=S.wave, prog=WV.boss?0.5:WV.t/WV.dur;
  let rate=(1.0+0.33*w+prog*0.27*w+Math.max(0,EARLY_A-EARLY_B*w))*MAPS[S.map].spawn*(modOn('swarm')?1.4:1)*ease(w);if(WV.boss)rate*=0.45;if(WV.nestKill)rate*=Math.pow(0.8,WV.nestKill);

  const alive=F.enemies.length;

  while(WV.acc>=1){
    const n=Math.min(Math.floor(WV.acc),1+Math.floor(Math.random()*(2+w/4)));

/* ================= telegraphs, bullets, bosses ================= */
function tele(o){o.max=o.t;F.tele.push(o);return o;}
function inTele(t,x,y,pad){if(t.kind==='circle')return Math.hypot(x-t.x,(y-t.y)*1.3)<t.r+(pad||0);return segDist(x,y,t.x,t.y,t.x2,t.y2)<t.w/2+(pad||0);}
function updateTele(h){
  for(const t of F.tele){

      for(const u of F.units)if(u.alive&&u.spawnDelay<=0&&inTele(t,u.x,u.y,u.r*0.4))damageAlly(u,t.dmg*0.6,t.owner);
      if(t.gate&&(t.kind==='circle'?Math.hypot(CORE.x-t.x,(CORE.y-t.y)*1.3)<t.r+CORE.r*0.7:segDist(CORE.x,CORE.y,t.x,t.y,t.x2,t.y2)<t.w/2+CORE.r*0.7))coreDamage(t.dmg*0.6,null,'tele:'+(t.owner?t.owner.type:'explosive'));
      if(t.kind==='circle'){burst(t.x,t.y-6,t.col||'#ff5f7a',16,220);ring(t.x,t.y,t.col||'#ff5f7a',t.r,.35);}

function bullet(x,y,ang,spd,dmg,col,r){F.bullets.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd*0.8,dmg,col:col||'#ff5fa2',r:r||9,life:4});}
function updateBullets(h){
  const hr=F.hero;
  for(const b of F.bullets){
    b.life-=h;b.x+=b.vx*h;b.y+=b.vy*h;
    if(b.life<=0||b.x<-60||b.x>1660||b.y<60||b.y>960){b.done=true;continue;}
    if(hr&&hr.alive&&Math.hypot(b.x-hr.x,(b.y-hr.y)*1.3)<b.r+hr.r*0.55){if(hr.inv<=0&&hr.dashT<=0){damageAlly(hr,b.dmg,null);b.done=true;burst(b.x,b.y-20,b.col,6,120);}continue;}
    for(const u of F.units){if(u.alive&&u.spawnDelay<=0&&Math.hypot(b.x-u.x,(b.y-u.y)*1.3)<b.r+u.r*0.6){damageAlly(u,b.dmg*0.6,null);b.done=true;break;}}
    if(!b.done&&Math.hypot(b.x-CORE.x,(b.y-CORE.y)*1.5)<CORE.r+8){coreDamage(b.dmg*0.4,null,'bullet');b.done=true;burst(b.x,b.y-20,b.col,6,120);}

function enemySpecial(e,h,al){

      if(hr&&hr.alive&&!e.hitHero&&Math.hypot(hr.x-e.x,(hr.y-e.y)*1.3)<e.r+hr.r*0.8){e.hitHero=true;damageAlly(hr,e.atk*2.6,e);}
      if(e.dT<=0){e.state=null;e.dashing=false;e.chT=3.5;e.stun=0.5;}return true;}
    e.chT-=h;
    if(e.chT<=0&&hr&&hr.alive&&dist(e,hr)<380&&dist(e,hr)>90){e.state='wind';e.wT=0.7;e.cAng=Math.atan2(hr.y-e.y,hr.x-e.x);e.face=Math.cos(e.cAng)>=0?1:-1;
      tele({kind:'line',x:e.x,y:e.y,x2:e.x+Math.cos(e.cAng)*380,y2:e.y+Math.sin(e.cAng)*380,w:e.r*1.8,t:0.7,dmg:0,col:'#ff9a4d',owner:e});return true;}
  }
  if(d.bomb){

    let near=coreDist(e)<40;for(const a of al)if(dist(e,a)<a.r+e.r+12){near=true;break;}

}

function grid(list){const g=new Map();for(const e of list){const k=(((e.x>>6)+20)*1000)+((e.y>>6)+20);let a=g.get(k);if(!a){a=[];g.set(k,a);}a.push(e);}return g;}
function near(g,x,y,cb){const cx=(x>>6)+20,cy=(y>>6)+20;for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const a=g.get((cx+i)*1000+cy+j);if(a)for(const e of a)cb(e);}}
function separation(al,foes){
  const g=grid(foes);
  for(const a of foes){near(g,a.x,a.y,b=>{if(b.id<=a.id)return;const dx=b.x-a.x,dy=(b.y-a.y)*1.5;const d=Math.hypot(dx,dy)||0.01;const m=(a.r+b.r)*0.8;if(d<m){const p=(m-d)/2,nx=dx/d,ny=dy/d;const wa=a.boss||a.dashing?0.15:1,wb=b.boss||b.dashing?0.15:1;a.x-=nx*p*wa;a.y-=ny*p*0.6*wa;b.x+=nx*p*wb;b.y+=ny*p*0.6*wb;}});}
  for(const u of al){near(g,u.x,u.y,e=>{const dx=e.x-u.x,dy=(e.y-u.y)*1.5;const d=Math.hypot(dx,dy)||0.01;const m=(u.r+e.r)*0.82;if(d<m){const p=m-d;const we=e.boss?0.15:0.75;e.x+=dx/d*p*we;e.y+=dy/d*p*0.4*we;if(!u.isHero||u.dashT<=0){u.x-=dx/d*p*(1-we)*0.5;}}});}
  for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){const a=al[i],b=al[j];const dx=b.x-a.x,dy=(b.y-a.y)*1.5;const d=Math.hypot(dx,dy)||0.01;const m=(a.r+b.r)*0.85;if(d<m){const p=(m-d)/2,nx=dx/d,ny=dy/d;const wa=a.isHero?0.3:1,wb=b.isHero?0.3:1;a.x-=nx*p*wa;a.y-=ny*p*0.6*wa;b.x+=nx*p*wb;b.y+=ny*p*0.6*wb;}}
  for(const e of foes){const dc=Math.hypot(e.x-CORE.x,(e.y-CORE.y)*1.5);const m=CORE.r+e.r*0.4;if(dc<m){const a=Math.atan2((e.y-CORE.y)*1.5,e.x-CORE.x);e.x=CORE.x+Math.cos(a)*m;e.y=CORE.y+Math.sin(a)*m/1.5;}}
}

/* ================= battle update ================= */
function updateBattle(h){
  if(!WV.boss){WV.t+=h;if(WV.t>=WV.dur){endWave();return;}}
  else if(WV.bossEnt&&!WV.bossEnt.alive){WV.t+=h;if(!WV.bossDeadT)WV.bossDeadT=WV.t;if(WV.t-WV.bossDeadT>0.9){endWave();return;}}
  else WV.t+=h;
  if(!(WV.boss&&WV.bossEnt&&!WV.bossEnt.alive))spawnTick(h);
  const al=allies(), foes=F.enemies;
  const hr=F.hero;
  const regen=has('halo')||synCount('cleric')>=4;
  const follow=S.formation==='follow'&&hr&&hr.alive;
  if(follow)updateHomes();
  // units
  for(const u of F.units){
    if(!u.alive||u.spawnDelay>0)continue;
    const bpu=F.banners.length?bannerPow(u.x,u.y):0;u.buffP=bpu;
    u.cdT-=h*(1+bpu*0.75);if(regen)u.hp=Math.min(u.maxHp,u.hp+u.maxHp*0.01*h);
    if(u.type==='cleric'&&u.cdT<=0){let best=null,br=0.96;for(const a of al){const r=a.hp/a.maxHp;if(r<br&&dist(u,a)<=u.range+80){br=r;best=a;}}
      if(best){u.cdT=u.cd;u.atkAnim=1;F.proj.push({x:u.x+12,y:u.y-36,tgt:best,tx:best.x,ty:best.y,spd:500,kind:'spark',heal:u.heal,bless:u.bless,side:'u'});continue;}}
    let tgt=null,bd=1e9;
    const anchor=follow?hr:null;
    for(const e of foes){if(!e.alive)continue;if(anchor?dist(e,anchor)>340:coreDist(e)>320)continue;const d=dist(u,e);if(d<bd){bd=d;tgt=e;}}
    if(!tgt){moveTo(u,u.homeX,u.homeY,h,follow?1.4:0.8);continue;}
    const d=bd-tgt.r-u.r*0.5;
    if(d<=u.range){u.moving=false;u.face=tgt.x>=u.x?1:-1;if(u.cdT<=0){u.cdT=u.cd*rand(.95,1.05)*(u.rage?0.45+0.55*u.hp/u.maxHp:1);u.atkAnim=1;unitAttack(u,tgt);}}
    else{let tx=tgt.x,ty=tgt.y;if(!follow){const dc=Math.hypot(tx-CORE.x,(ty-CORE.y)*1.5);if(dc>260){const a=Math.atan2((ty-CORE.y)*1.5,tx-CORE.x);tx=CORE.x+Math.cos(a)*260;ty=CORE.y+Math.sin(a)*260/1.5;}}moveTo(u,tx,ty,h,follow?1.2:1);}
  }
  // orbit blades
  if(cl('orbit')&&hr&&hr.alive){
    F.orbA+=h*3.4;const n=1+cl('orbit')+(evo('halo')?2:0),dmg=hs().atk*0.5*(1+0.2*(cl('orbit')-1));
    for(let i=0;i<n;i++){const a=F.orbA+i/n*Math.PI*2,bx=hr.x+Math.cos(a)*78,by=hr.y-24+Math.sin(a)*78*0.7;
      for(const e of foes){if(!e.alive||e.oc>F.t)continue;if(Math.hypot(e.x-bx,(e.y-e.h*e.sc*0.4)-by)<e.r+16){e.oc=F.t+0.35;hitEnemy(e,dmg,'blade',{kb:6,ang:a});if(evo('halo')&&Math.random()<0.3)chainLightning(e,3,dmg);}}}
  }
  // spirit wolves
  const nw=cl('wolf'), pack=evo('pack');
  while(F.wolves.length<nw)F.wolves.push({x:hr?hr.x:CORE.x,y:hr?hr.y:CORE.y,face:1,anim:0,cdT:0,spd:280,moving:true,atkAnim:0});
  for(const wf of F.wolves){
    wf.anim+=h;wf.cdT-=h;wf.atkAnim=Math.max(0,wf.atkAnim-h*5);wf.spd=pack?340:280;
    const base=hr&&hr.alive?hr:COREE;
    const tg=nearest(wf,foes.filter(e=>e.alive&&dist(e,base)<520));
    if(tg){if(dist(wf,tg)>tg.r+16)moveTo(wf,tg.x,tg.y,h);else if(wf.cdT<=0){wf.cdT=0.55;wf.atkAnim=1;wf.face=tg.x>wf.x?1:-1;const dl=hitEnemy(tg,hs().atk*0.7*(pack?2.2:1),'wolf',{kb:8,ang:Math.atan2(tg.y-wf.y,tg.x-wf.x)});if(pack)healHero(dl*0.08);}}
    else if(dist(wf,base)>90)moveTo(wf,base.x-50,base.y+10,h);else wf.moving=false;
  }
  // fires
  const fm=evo('inferno')?2:1;
  for(const f of F.fires){f.life-=h;f.tick-=h;if(f.tick<=0){f.tick=0.25;const dmg=hs().atk*0.35*(1+0.5*Math.max(0,cl('fire')-1))*fm;for(const e of foes)if(e.alive&&Math.hypot(e.x-f.x,(e.y-f.y)*1.4)<30)hitEnemy(e,dmg,'fire',{});}}
  F.fires=F.fires.filter(f=>f.life>0);
  if(F.fires.length>260)F.fires.splice(0,F.fires.length-260);
  // meteors
  for(const m of F.meteors){m.t-=h;if(m.t<=0&&!m.done){m.done=true;const dmg=m.dmg,mr=m.r;
    for(const e of foes)if(e.alive&&Math.hypot(e.x-m.x,(e.y-m.y)*1.3)<mr)hitEnemy(e,dmg,'meteor',{crit:true,kb:30,ang:Math.atan2(e.y-m.y,e.x-m.x),stun:0.3});
    burst(m.x,m.y-10,'#ff9a4d',32,280);burst(m.x,m.y-10,'#ffe08a',18,190);ring(m.x,m.y,'#ff7a59',mr,.5);decal('scorch',m.x,m.y,mr*0.8,3);
    shake(11);AU.noise(0.5,0.12,700);AU.tone(70,.5,'sawtooth',.09,.5);}}
  F.meteors=F.meteors.filter(m=>!m.done);
  // ultimates over time
  for(const s of F.storms){s.t-=h;s.tick-=h;if(s.tick<=0){s.tick=0.2;for(const e of foes)if(e.alive&&Math.hypot(e.x-s.x,(e.y-s.y)*1.3)<s.r)hitEnemy(e,s.dmg,'storm',{});if(AU.thr('storm',90))AU.bow(false);}}
  F.storms=F.storms.filter(s=>s.t>0);
  for(const b of F.holes){b.t-=h;b.tick-=h;
    for(const e of foes){if(!e.alive)continue;const dx=b.x-e.x,dy=b.y-e.y,d=Math.hypot(dx,dy);if(d<b.r&&d>8){const pull=(e.boss?40:e.elite?140:260)*h;e.x+=dx/d*Math.min(pull,d);e.y+=dy/d*Math.min(pull,d);}}
    if(b.tick<=0){b.tick=0.25;for(const e of foes)if(e.alive&&Math.hypot(e.x-b.x,(e.y-b.y)*1.3)<70)hitEnemy(e,b.dmg*0.06,'hole',{});}
    if(b.t<=0){for(const e of foes)if(e.alive&&Math.hypot(e.x-b.x,(e.y-b.y)*1.3)<b.er)hitEnemy(e,b.dmg,'hole',{crit:true,kb:60,ang:Math.atan2(e.y-b.y,e.x-b.x),stun:0.5});
      ring(b.x,b.y,'#b48cff',b.er,.6);ring(b.x,b.y,'#ffffff',b.er*0.6,.4);burst(b.x,b.y-10,'#d4c2ff',40,320);shake(16);F.hitStop=0.08;AU.noise(.6,.14,700);AU.tone(60,.5,'sawtooth',.09,.5);}}
  F.holes=F.holes.filter(b=>b.t>0);
  updateSkillFX(h,foes);
  updateTele(h);updateBullets(h);
  if(S.phase!=='battle')return;
  // enemies
  for(const e of foes){
    if(!e.alive)continue;
    if(e.frozen>0){e.frozen-=h;e.moving=false;continue;}
    if(e.stun>0){e.stun-=h;e.moving=false;continue;}
    const sm=(e.slowT>0?0.55:1)*(F.warpT>0?0.4:1);if(e.slowT>0)e.slowT-=h;if(e.taunt>0)e.taunt-=h;
    e.cdT-=h*(F.warpT>0?0.5:1);const d=ED[e.type];
    if(d.treasure){treasureAI(e,h,sm);continue;}
    if(d.nest){nestAI(e,h);continue;}
    if(d.tgt==='core'&&!d.fly&&!e.boss&&S.towers&&S.towers.length){const tw=towerNear(e);if(tw){e.moving=false;e.face=tw.x>=e.x?1:-1;if(e.cdT<=0){e.cdT=d.cd;e.atkAnim=1;hitTower(tw,e.atk);}continue;}}
    if(e.boss&&bossAI(e,h)){if(S.phase!=='battle')return;continue;}
    if(enemySpecial(e,h,al))continue;
    if(d.heal&&e.cdT<=0){let best=null,br=0.9;for(const a of foes){if(a===e||!a.alive)continue;const r=a.hp/a.maxHp;if(r<br&&dist(e,a)<=e.range){br=r;best=a;}}if(best){e.cdT=d.cd;e.atkAnim=1;healAlly(best,d.heal*atkMult(S.wave));continue;}}
    if(e.affix==='vampiric')e.hp=Math.min(e.maxHp,e.hp+e.maxHp*0.02*h);
    if(d.bomb){let dest=COREE,bd2=coreDist(e);for(const a of al){const dd=dist(e,a);if(dd<bd2){bd2=dd;dest=a;}}moveTo(e,dest.x,dest.y,h,sm);continue;}
    const hunt=(d.tgt==='hero'||e.taunt>0)&&hr&&hr.alive;
    let tgt=null,td=1e9;
    for(const a of al){const dd=dist(e,a)-a.r-e.r*0.5;if(dd<=e.range&&dd<td){tgt=a;td=dd;}}
    const dc=coreDist(e);
    if(!tgt&&dc<=e.range&&!hunt)tgt=COREE;
    if(tgt){e.moving=false;e.face=tgt.x>e.x?1:-1;if(e.cdT<=0){e.cdT=d.cd*rand(.95,1.05);e.atkAnim=1;enemyAttack(e,tgt);}}
    else{
      let dest=COREE;
      if(hr&&hr.alive&&(hunt||(!d.heavy&&!d.proj&&dist(e,hr)<70)))dest=hr;
      const dx=dest.x-e.x,dy=dest.y-e.y,dd=Math.hypot(dx,dy)||1;
      e.x+=dx/dd*e.spd*sm*h;e.y+=dy/dd*e.spd*sm*h;e.moving=true;if(Math.abs(dx)>2)e.face=dx>0?1:-1;
    }
    if(S.phase!=='battle')return;
  }
  separation(al,F.enemies.filter(e=>e.alive));
  updateProj(h,foes);
  F.enemies=F.enemies.filter(e=>e.alive);
}
function unitAttack(u,tgt){
  const bm=(1+(u.buffP||0))*(u.blessT>0?1.25:1);
  if(!u.proj){
    let dmg=u.atk*bm,crit=false;
    if(u.crit&&Math.random()<u.crit){dmg*=2;crit=true;}
    hitEnemy(tgt,dmg,'unit',{crit});if(u.leech)u.hp=Math.min(u.maxHp,u.hp+dmg*u.leech);
    burst(tgt.x,tgt.y-tgt.h*tgt.sc*0.5,crit?'#ff5fa2':'#ffffff',crit?8:4,110);
  }else{
    const spd={arrow:780,orb:440,fire:480,spark:500}[u.proj]||500;
    F.proj.push({x:u.x+u.face*12*u.sc,y:u.y-28*u.sc,tgt,tx:tgt.x,ty:tgt.y-20,spd,kind:u.proj,dmg:u.atk*bm,splash:u.splash,slow:u.slow,elite:u.elite,side:'u'});
    AU.shoot();
  }
}
function enemyAttack(e,tgt){
  const d=ED[e.type];
  if(d.proj){F.proj.push({x:e.x+e.face*10,y:e.y-26*e.sc,tgt,tx:tgt.x,ty:tgt.y-20,spd:d.proj==='hex'?400:560,kind:d.proj,dmg:e.atk,side:'e',splash:d.proj==='hex'?60:0,src:e});return;}
  if(tgt===COREE){coreDamage(e.atk,e);burst(e.x+e.face*14,e.y-20,'#7ff3e1',3,80);return;}
  damageAlly(tgt,e.atk*(tgt.isHero?1.2:1),e);
}
function updateProj(h,foes){
  for(const p of F.proj){
    if(p.kind==='wave'||p.kind==='harrow'){
      p.life-=h;p.x+=p.vx*h;p.y+=p.vy*h;if(p.life<=0){p.done=true;continue;}
      const rad=p.kind==='wave'?(p.big?34:22):10;
      for(const e of foes){if(!e.alive||p.hit.has(e))continue;if(Math.hypot(e.x-p.x,(e.y-e.h*e.sc*0.4)-p.y)<e.r+rad){p.hit.add(e);
        if(p.kind==='wave'){const st=hs();const dl=hitEnemy(e,p.dmg,'wave',{kb:10,ang:p.ang,dir:p.ang,crit:p.big});if(st.leech)healHero(dl*st.leech);}
        else{heroHit(e,p.dmg,'hero',{kb:10,ang:p.ang,dir:p.ang,stun:0.05});burst(p.x,p.y,'#d8ffb0',4,100);p.pierce--;if(p.pierce<0){p.done=true;break;}}}}
      continue;
    }
    if(p.kind==='horb'){
      p.life-=h;p.x+=p.vx*h;p.y+=p.vy*h;
      let boom=p.life<=0;
      if(!boom)for(const e of foes){if(e.alive&&Math.hypot(e.x-p.x,(e.y-e.h*e.sc*0.4)-p.y)<e.r+12){boom=true;break;}}
      if(Math.random()<0.6)addPart({type:'spark',x:p.x,y:p.y,vx:rand(-30,30),vy:rand(-30,30),life:.3,max:.3,col:'#d4c2ff',size:3.5});
      if(boom){p.done=true;for(const e of foes){if(!e.alive)continue;const d=Math.hypot(e.x-p.x,(e.y-e.h*e.sc*0.4-p.y)*1.2)-e.r*0.5;if(d<p.aoe)heroHit(e,p.dmg,'hero',{kb:14,ang:Math.atan2(e.y-p.y,e.x-p.x)});}
        ring(p.x,p.y+18,'#b48cff',p.aoe,.35);burst(p.x,p.y,'#e2d8ff',12,200);if(AU.thr('orbx',60))AU.noise(.12,.07,2400);}
      continue;
    }
    if(p.tgt&&p.tgt.alive){p.tx=p.tgt.x;p.ty=p.tgt.y-p.tgt.h*p.tgt.sc*(p.tgt===COREE?0.6:0.5);}
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),s=p.spd*h;
    p.ang=Math.atan2(dy,dx);
    if(d<=s+4){p.done=true;projHit(p);}else{p.x+=dx/d*s;p.y+=dy/d*s;}
    if((p.kind==='fire'||p.kind==='orb'||p.kind==='hex')&&Math.random()<0.5)addPart({type:'spark',x:p.x,y:p.y,vx:rand(-20,20),vy:rand(-20,20),life:.25,max:.25,col:p.kind==='fire'?'#ffb35c':p.kind==='hex'?'#ff5fa2':'#c9b8ff',size:3});
  }
  F.proj=F.proj.filter(p=>!p.done);
}
function projHit(p){
  if(p.kind==='spark'&&p.heal){if(p.tgt&&p.tgt.alive){healAlly(p.tgt,p.heal);if(p.bless&&!p.tgt.isHero){p.tgt.blessT=4;ring(p.tgt.x,p.tgt.y-10,'#ff9cc2',34,.3);}}return;}
  if(p.side==='u'){
    if(p.tgt&&p.tgt.alive&&p.tgt.side==='e'){if(p.slow&&!p.tgt.boss)p.tgt.slowT=Math.max(p.tgt.slowT,p.slow);hitEnemy(p.tgt,p.dmg*(p.elite&&(p.tgt.elite||p.tgt.boss)?p.elite:1),'unit',{});}
    if(p.splash){for(const o of F.enemies){if(o.alive&&o!==p.tgt&&Math.hypot(o.x-p.tx,(o.y-o.h*o.sc*0.5)-p.ty)<p.splash){if(p.slow&&!o.boss)o.slowT=Math.max(o.slowT,p.slow);hitEnemy(o,p.dmg*0.6,'unit',{});}}
      const col=p.kind==='fire'?'#ff9a4d':p.slow?'#9be8ff':'#b49bff';burst(p.tx,p.ty,col,12,160);ring(p.tx,p.ty,col,p.splash,.35);}
  }else{
    if(p.tgt===COREE)coreDamage(p.dmg,null,'proj:'+(p.src?p.src.type:'?'));
    else if(p.tgt&&p.tgt.alive)damageAlly(p.tgt,p.dmg,p.src);
    if(p.splash){for(const o of allies()){if(o!==p.tgt&&Math.hypot(o.x-p.tx,(o.y-o.h*o.sc*0.5)-p.ty)<p.splash)damageAlly(o,p.dmg*0.6,null);}burst(p.tx,p.ty,'#ff5fa2',12,160);ring(p.tx,p.ty,'#ff5fa2',p.splash,.35);}
    else burst(p.tx,p.ty,'#ece9dc',4,90);
  }
}
function updatePickups(h){
  const hr=F.hero, st=hs(), collect=S.phase==='collect';
  for(const g of F.gems){
    g.t+=h;
    if(hr&&hr.alive){const d=Math.hypot(g.x-hr.x,g.y-(hr.y-14));
      if(collect||d<st.magnet)g.mag=true;
      if(g.mag){const sp=Math.max(320,900-d)*(collect?1.6:1);const dx=hr.x-g.x,dy=(hr.y-14)-g.y;g.x+=dx/(d||1)*sp*h;g.y+=dy/(d||1)*sp*h;if(d<20){g.done=true;gainXp(g.v);F.gemStreak=(F.gemStreak||0)+1;F.gemT=0.4;AU.gem(F.gemStreak);}}
    }else if(collect){g.done=true;gainXp(g.v);}
  }
  F.gems=F.gems.filter(g=>!g.done);
  if(F.gemT>0){F.gemT-=h;if(F.gemT<=0)F.gemStreak=0;}
  for(const c of F.chests){
    c.t+=h;
    if(hr&&hr.alive){const d=Math.hypot(c.x-hr.x,c.y-hr.y);if(collect&&d>30){c.x+=(hr.x-c.x)*Math.min(1,h*4);c.y+=(hr.y-c.y)*Math.min(1,h*4);}
      if(d<40&&!S.modal){c.done=true;openChest(c.legend);break;}}
    else if(collect&&!S.modal){c.done=true;openChest(c.legend);break;}
  }
  F.chests=F.chests.filter(c=>!c.done);
}
function updateAmbient(h){
  const M=MAPS[scn()], A=F.amb, want=M.amb==='snow'?90:M.amb==='embers'?60:28;
  while(A.length<want)A.push({x:rand(0,VW),y:rand(0,900),vx:0,vy:0,t:rand(0,10),s:rand(1,3)});
  for(const p of A){p.t+=h;
    if(M.amb==='snow'){p.x+=(20+Math.sin(p.t)*25)*h;p.y+=(40+p.s*16)*h;}
    else if(M.amb==='embers'){p.x+=Math.sin(p.t*1.3)*20*h;p.y-=(30+p.s*14)*h;}
    else{p.x+=Math.cos(p.t*0.7+p.s)*18*h;p.y+=Math.sin(p.t*0.9+p.s)*14*h;}
    if(p.y>920)p.y=-10;if(p.y<-20)p.y=910;if(p.x>VW+20)p.x=-10;if(p.x<-20)p.x=VW+10;}
}
/* ================= world: obstacles, pools, shrines, nests ================= */

}
function updateSkillFX(h,foes){

      for(const e of foes)if(e.alive&&Math.hypot(e.x-tr.x,(e.y-tr.y)*1.3)<tr.r){hitEnemy(e,tr.dmg,'skill',{});if(e.alive)e.frozen=Math.max(e.frozen,(e.boss?0.3:1)*tr.fr);}
      ring(tr.x,tr.y,'#9be8ff',tr.r,.5);ring(tr.x,tr.y,'#ffffff',tr.r*0.5,.35);decal('frost',tr.x,tr.y,tr.r,2.5);burst(tr.x,tr.y-10,'#bff3ff',26,260);AU.tone(1600,.25,'sine',.05,.4);AU.noise(.25,.06,5000);shake(5);}}

    if(c.tick<=0){c.tick=0.4;for(const e of foes)if(e.alive&&Math.hypot(e.x-c.x,(e.y-c.y)*1.3)<c.r){hitEnemy(e,c.dmg,'skill',{});if(Math.random()<0.3)addPart({type:'spark',x:e.x,y:e.y-20,vx:rand(-20,20),vy:-40,life:.4,max:.4,col:'#a6f56b',size:3});}}}
  if(F.clouds.length)F.clouds=F.clouds.filter(c=>c.t>0);
  for(const t of F.tornados){t.t-=h;t.tick-=h;t.x+=t.vx*h;t.y+=t.vy*h;
    if(t.x<AR.x0||t.x>AR.x1)t.vx*=-1;if(t.y<AR.y0||t.y>AR.y1)t.vy*=-1;t.x=clamp(t.x,AR.x0,AR.x1);t.y=clamp(t.y,AR.y0,AR.y1);
    for(const e of foes){if(!e.alive||e.boss)continue;const dx=t.x-e.x,dy=t.y-e.y,d=Math.hypot(dx,dy);if(d<130&&d>6){const pl=Math.min(d,(e.elite?90:220)*h);e.x+=dx/d*pl;e.y+=dy/d*pl;}}
    if(t.tick<=0){t.tick=0.15;for(const e of foes)if(e.alive&&Math.hypot(e.x-t.x,(e.y-t.y)*1.3)<70)hitEnemy(e,t.dmg,'skill',{});}
    if(Math.random()<0.6)addPart({type:'spark',x:t.x+rand(-30,30),y:t.y-rand(0,70),vx:rand(-120,120),vy:-rand(20,80),life:.3,max:.3,col:'#e2e8ff',size:2.5});}
  if(F.tornados.length)F.tornados=F.tornados.filter(t=>t.t>0);
  for(const t of F.totems){t.t-=h;t.tick-=h;if(t.tick<=0){t.tick=0.5;
    for(const a of allies())if(Math.hypot(a.x-t.x,(a.y-t.y)*1.3)<t.r)healAlly(a,a.maxHp*0.03*t.pow);
    if(Math.hypot(CORE.x-t.x,(CORE.y-t.y)*1.3)<t.r+CORE.r){S.core.hp=Math.min(S.core.max,S.core.hp+S.core.max*0.006*t.pow);}
    ring(t.x,t.y,'#7ff3e1',t.r*0.6,.4);}}
  if(F.totems.length)F.totems=F.totems.filter(t=>t.t>0);
  for(const s2 of F.strikes){s2.t-=h;if(s2.t<=0&&!s2.done){s2.done=true;
    const c=foes.filter(e=>e.alive&&Math.hypot(e.x-s2.x,(e.y-s2.y)*1.3)<s2.r);const e=c.length?c[Math.floor(Math.random()*c.length)]:null;

    shake(3);AU.zap();}}
  if(F.strikes.length)F.strikes=F.strikes.filter(s2=>!s2.done);

    if(!g.alive)continue;g.life-=h;g.anim+=h;g.flash=Math.max(0,g.flash-h*5);g.atkAnim=Math.max(0,g.atkAnim-h*4);if(g.pop>0)g.pop-=h;g.cdT-=h;

    const tg=nearest(g,foes,560);
    if(!tg){if(hr&&hr.alive&&dist(g,hr)>120)moveTo(g,hr.x+40,hr.y+30,h);else g.moving=false;continue;}
    const d=dist(g,tg)-tg.r-g.r*0.5;
    if(d>g.range)moveTo(g,tg.x,tg.y,h);
    else{g.moving=false;g.face=tg.x>=g.x?1:-1;if(g.cdT<=0){g.cdT=g.cd;g.atkAnim=1;
      for(const e of foes)if(e.alive&&Math.hypot(e.x-tg.x,(e.y-tg.y)*1.3)<80)hitEnemy(e,g.atk,'skill',{kb:30,ang:Math.atan2(e.y-g.y,e.x-g.x),stun:0.3,heavyHit:true});
      ring(tg.x,tg.y,'#b48cff',80,.3);decal('crack',tg.x,tg.y,60,1.2);burst(tg.x,tg.y-6,'#c9d3f2',10,180);AU.smash(false);shake(4);}}
  }
  if(F.golems.length)F.golems=F.golems.filter(g=>g.alive);
}

/* ================= army ================= */
function summon(type,star){const u={uid:S.uid++,type,star,nm:UNIT[type].hero?'':unitName()};S.army.push(u);S.lastNew=u.uid;mergeAll();}
function mergeAll(){
  let changed=true;
  while(changed){changed=false;
    for(const t of ORDER){for(let s=1;s<=2;s++){
      const grp=S.army.filter(u=>u.type===t&&u.star===s);
      if(grp.length>=3){const take=grp.slice(0,3),idx=S.army.indexOf(take[0]);const nu={uid:S.uid++,type:t,star:s+1,nm:take[0].nm||unitName()};
        S.army=S.army.filter(u=>!take.includes(u));S.army.splice(Math.min(idx,S.army.length),0,nu);S.lastNew=nu.uid;changed=true;S.stats.bestStar=Math.max(S.stats.bestStar,s+1);toast(`${UNIT[t].name} merged to ${'★'.repeat(s+1)}`,'good');AU.merge();if(s+1===3)unlockAch('star3');}
    }}
  }
}
function canRecruit(t){if(S.army.length<S.armyMax)return true;if(UNIT[t].hero)return false;return S.army.filter(u=>u.type===t&&u.star===1).length>=2;}
function rollOffers(){
  const pool={knight:10,archer:10,rogue:9,mage:9,cleric:8,paladin:6,sniper:6,berserker:6,frostmage:6,warpriest:6,dragon:S.wave>=6?3:0};
  for(const u of S.army)if(pool[u.type]&&u.star<3)pool[u.type]=Math.max(pool[u.type],22);
  const out=[],cnt={};for(let i=0;i<5;i++){let k=null;for(let t=0;t<14;t++){k=wpick(pool);const n=cnt[k]||0;if(n===0||(n<2&&S.army.some(u=>u.type===k)))break;}cnt[k]=(cnt[k]||0)+1;out.push({t:k,sold:false});}
  {const av=HIRE.filter(k=>UNIT[k].hero!==S.hero&&!S.army.some(u=>u.type===k));if(av.length)out[4]={t:av[Math.floor(Math.random()*av.length)],sold:false};}
  return out;
}
function buyOffer(i){
  const o=S.offers[i];if(!o||o.sold||!shopOpen())return;
  const U=UNIT[o.t];if(U.unlock&&S.wave<U.unlock)return;
  if(U.hero&&S.army.some(u=>u.type===o.t)){toast(`${U.name} already fights for you`,'bad');AU.err();return;}
  const c=unitCost(o.t);
  if(S.gold<c){toast('Not enough gold','bad');AU.err();return;}
  if(!canRecruit(o.t)){toast('Army full — sell a unit, or buy a 3rd copy to merge','bad');AU.err();return;}
  S.gold-=c;o.sold=true;S.stats.recruits++;summon(o.t,1);
  syncField(S.phase==='shop');AU.buy();renderShop();
}
function sellUnit(uid){
  if(!shopOpen())return;
  const i=S.army.findIndex(u=>u.uid===uid);if(i<0)return;
  const u=S.army.splice(i,1)[0];const g=sellValue(u);S.gold+=g;AU.coin();toast(`Sold ${UNIT[u.type].name} for ${g} gold`);
  syncField(S.phase==='shop');renderShop();
}
function buyTrain(k){if(!shopOpen())return;const c=trainCost(k);if(S.gold<c){toast('Not enough gold','bad');AU.err();return;}S.gold-=c;S.train[k]++;HSC=null;if(k==='gate'){const m=coreMax();S.core.hp+=m-S.core.max;S.core.max=m;}if(k==='hp')refreshHero(false);AU.buy();renderShop();}

/* ================= progression ================= */
const WEAPON_CARDS=['wave','orbit','wolf','chain'];
function evoReady(){return EVOS.filter(v=>!S.cards[v.id]&&cl(v.base)>=CARDS.find(c=>c.id===v.base).max&&cl(v.need)>=1);}
function pickCards(n){
  const pool=CARDS.filter(cd=>cl(cd.id)<cd.max&&(!cd.req||cd.req())&&isUnl(cd.id));const out=[];
  const ev=evoReady();if(ev.length)out.push(ev[0].id);
  if(!WEAPON_CARDS.some(id=>cl(id))){const wp=pool.filter(cd=>WEAPON_CARDS.includes(cd.id));if(wp.length){const pk=wp[Math.floor(Math.random()*wp.length)];out.push(pk.id);pool.splice(pool.indexOf(pk),1);}}
  const partners=new Set(EVOS.filter(v=>!S.cards[v.id]&&cl(v.base)>=CARDS.find(c=>c.id===v.base).max&&cl(v.need)<1).map(v=>v.need));
  while(out.length<n&&pool.length){const w={};pool.forEach((cd,i)=>w[i]=RAR[cd.rar].w*(cl(cd.id)>0&&['wave','orbit','wolf','chain','fire','qm'].includes(cd.id)?2:1)*(partners.has(cd.id)?4:1));const i=+wpick(w);out.push(pool[i].id);pool.splice(i,1);}
  return out.length>1&&!ev.length?shuffle(out):out;
}
function pickSkills(){const own=new Set([skillOf('q'),skillOf('e')]);return shuffle(POOL.filter(id=>!own.has(id))).slice(0,3).map(id=>'sk:'+id);}
function openLevelUp(){
  const lv=S.level-S.pending+1;
  S.modal='levelup';
  if(lv===1)S.choices=shuffle(WEAPON_CARDS.filter(id=>cl(id)<1)).slice(0,3);
  else if(!S.fskill&&lv>=5&&!S.skillOffered){S.skillOffered=true;S.choices=pickSkills();}
  else S.choices=pickCards(has('crown')?4:3);
  if(!S.choices.length){S.pending=0;S.modal=null;return;}
  AU.levelup();renderLevelUp();
}

}

/* ================= meta: achievements & shards ================= */
function unlockAch(id){
  if(P.ach[id])return;const a=ACH.find(x=>x.id===id);if(!a)return;
  P.ach[id]=Date.now();P.shards+=a.r;saveP();if(NATIVE)try{NATIVE.achieve(id);}catch(e){}
  toast(`🏆 ${a.name} — +${a.r} shards`,'good');AU.ach();
}
function checkHeroAch(){if(HERO_ORDER.every(k=>P.heroes[k]))unlockAch('allheroes');}
function runShards(won){
  const s=S.stats;let v=S.wave*4+Math.floor(s.kills/25)+s.bosses*15+s.elites*2+(won?60:0);
  return Math.round(v*MAPS[S.map].shard*(1+0.2*S.asc)*(S.daily?1.25:1));
}
function finishRun(won){
  if(won&&!S.won){S.won=true;P.stats.wins++;}
  const total=runShards(!!S.won), sh=Math.max(0,total-(S.awarded||0));S.awarded=total;
  P.shards+=sh;S.shardsEarned=sh;
  if(!S.counted){S.counted=true;P.stats.runs++;}

function ensureQuests(){if(!Array.isArray(P.quests))P.quests=[];while(P.quests.length<3)P.quests.push(genQuest());}
function genQuest(){
  const used=new Set(P.quests.map(q=>q.t));const opts=QUEST_T.filter(q=>!used.has(q.t));const T=opts[Math.floor(Math.random()*opts.length)]||QUEST_T[0];
  const i=Math.floor(Math.random()*T.n.length);const owned=HERO_ORDER.filter(k=>P.heroes[k]);
  return {t:T.t,n:T.n[i],r:T.r[i],prog:0,h:T.hero?owned[Math.floor(Math.random()*owned.length)]:null};
}
function questText(q){const T=QUEST_T.find(x=>x.t===q.t);return T?T.d(q.n,q.h):q.t;}
function updateQuests(){
  ensureQuests();const st=S.stats,done=[];
  const add=S.qCounted||{};
  for(const q of P.quests){
    let v=null;
    if(q.t==='kills')v=q.prog+st.kills-(add.kills||0);
    else if(q.t==='herokills')v=q.prog+(S.hero===q.h?st.kills-(add.kills||0):0);
    else if(q.t==='elites')v=q.prog+st.elites-(add.elites||0);
    else if(q.t==='bosses')v=q.prog+st.bosses-(add.bosses||0);
    else if(q.t==='casts')v=q.prog+st.casts-(add.casts||0);
    else if(q.t==='treasure')v=q.prog+st.treasure-(add.treasure||0);
    else if(q.t==='wave')v=Math.max(q.prog,S.wave-(S.phase==='over'?1:0));
    else if(q.t==='combo')v=Math.max(q.prog,st.maxCombo);
    else if(q.t==='evo')v=Math.max(q.prog,st.evos);
    else if(q.t==='star3')v=Math.max(q.prog,st.bestStar>=3?1:0);
    else if(q.t==='gold')v=Math.max(q.prog,st.goldEarned);
    q.prog=Math.min(q.n,v);
    if(q.prog>=q.n){done.push(q);P.shards+=q.r;P.bounties=(P.bounties||0)+1;}
  }
  S.qCounted={kills:st.kills,elites:st.elites,bosses:st.bosses,casts:st.casts,treasure:st.treasure};

}

function bump(sel){const el=$(sel);if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
let SCALE=1;
function fit(){VW=Math.round(clamp(900*innerWidth/innerHeight,1200,2400)/2)*2;SCALE=Math.min(innerWidth/VW,innerHeight/900);stage.style.width=VW+'px';if(cv.width!==VW){cv.width=VW;cv.style.width=VW+'px';}stage.style.transform=`scale(${SCALE})`;updateCam(0,true);}
function syncMusic(force){
  if(!AU.ctx)return;
  let want=null;
  if(S.phase==='title')want='title';
  else if(S.phase==='battle'||S.phase==='collect')want=WV&&WV.boss&&WV.bossEnt&&WV.bossEnt.alive?'boss':'battle';
  else if(S.phase==='shop')want='shop';
  else if(S.phase==='victory')want='title';
  {const mu=(want==='battle'||want==='boss')?(MAPS[scn()].mus||[0,1]):[0,1];MUS.tr=mu[0];MUS.bm=mu[1];}
  if(want!==MUS.track||force){if(want)MUS.play(want);else MUS.track=null;}
}

const ABK=['dash','q','e','shock','f'];

function doAct(a,arg){
  AU.click();
  if(a==='play'){if(!P.intro)showIntro();else showSelect();}
  else if(a==='introOk'){P.intro=true;saveP();showSelect();}
  else if(a==='start')newRun(HSEL,MSEL);
  else if(a==='again')newRun(S.hero,S.map);
  else if(a==='continue')continueRun();
  else if(a==='selHero'){HSEL=arg;showSelect();}
  else if(a==='unlockHero')unlockHero(arg);
  else if(a==='selMap'){MSEL=arg;showSelect();}
  else if(a==='lockedMap'){toast(`${MAPS[arg].name} is locked — ${MAPS[arg].unlock}`,'bad');AU.err();}
  else if(a==='unlockAll'){for(const k of HERO_ORDER)P.heroes[k]=true;for(const k of MAP_ORDER)P.maps[k]=true;saveP();toast('Test mode: all heroes & maps unlocked','good');AU.chest();showSettings();}
  else if(a==='sanctum'){if(S.phase!=='title')toTitle();showSanctum();}
  else if(a==='perm')buyPerm(arg);
  else if(a==='achievements')showAch();
  else if(a==='settings')showSettings('main');
  else if(a==='settingsP')showSettings('pause');
  else if(a==='tog'){P.settings[arg]=!P.settings[arg];saveP();showSettings();}
  else if(a==='fullscreen')toggleFS();
  else if(a==='resetSave'){if(!RESETARM){RESETARM=true;showSettings();return;}try{localStorage.removeItem(SAVE_KEY);}catch(e){}if(NATIVE)try{NATIVE.writeSave('');}catch(e){}P=loadP();RESETARM=false;applySettings();toast('Save erased','bad');showTitle();}
  else if(a==='how'){overlay(howHTML('back'));MENU='how';}
  else if(a==='howp')overlay(howHTML('pauseMenu'));
  else if(a==='back')showTitle();
  else if(a==='missions')showMissions();
  else if(a==='fshop')toggleFieldShop();
  else if(a==='heroshop')showHeroShop();
  else if(a==='login'){claimLogin();if(MENU==='missions')showMissions();else showTitle();}
  else if(a==='title'){S.paused=false;toTitle();}
  else if(a==='resume')resume();
  else if(a==='pauseMenu'){if(S.paused)overlay(pauseHTML());else togglePause();}
  else if(a==='card')pickCard(+arg);
  else if(a==='pact')pickPact(+arg);
  else if(a==='cardReroll')cardReroll();
  else if(a==='relic')pickRelic(+arg);
  else if(a==='buy')buyOffer(+arg);
  else if(a==='reroll')rerollShop();
  else if(a==='repair')repairGate();
  else if(a==='train')buyTrain(arg);
  else if(a==='next')startWave(+arg||0);
  else if(a==='endless'){S.endless=true;hideOverlay();openShop();}
  else if(a==='daily')startDaily();
  else if(a==='music'){toggleMusic();if(MENU==='main')showTitle();}
  else if(a==='quit'){if(NATIVE)NATIVE.quit();}
  else if(a==='ascUp'){P.ascSel[MSEL]=Math.min((P.ascSel[MSEL]||0)+1,P.asc[MSEL]||0);saveP();showSelect();}
  else if(a==='ascDown'){P.ascSel[MSEL]=Math.max((P.ascSel[MSEL]||0)-1,0);saveP();showSelect();}
  else if(a==='skin'){if(mLevel(HSEL)>=SKINS[arg].lv){P.skin[HSEL]=arg;saveP();showSelect();}else{toast(`${SKINS[arg].name} skin unlocks at Mastery ${SKINS[arg].lv}`,'bad');AU.err();}}
}

const KMAP={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',Space:'attack',KeyJ:'attack'};
document.addEventListener('keydown',e=>{
  AU.init();
  if(e.code==='KeyM'&&!e.repeat){toggleMusic();if(S.phase==='title'&&MENU==='main')showTitle();return;}
  const ov=!$('#overlay').classList.contains('hidden');
  if(S.modal==='levelup'){if(/^Digit[1-4]$/.test(e.code))pickCard(+e.code.slice(5)-1);else if(e.code==='KeyR')cardReroll();return;}
  if(S.modal==='chest'){if(/^Digit[1-3]$/.test(e.code))pickRelic(+e.code.slice(5)-1);return;}
  if(S.modal==='pact'){if(/^Digit[1-3]$/.test(e.code))pickPact(+e.code.slice(5)-1);return;}
  if(S.modal==='fshop'){if(/^Digit[1-5]$/.test(e.code))buyOffer(+e.code.slice(5)-1);else if(e.code==='KeyB'||e.code==='Escape'||e.code==='Enter')toggleFieldShop();return;}
  if(S.phase==='shop'&&!S.paused){if(/^Digit[1-5]$/.test(e.code))buyOffer(+e.code.slice(5)-1);else if(e.code==='Enter')startWave();else if(e.code==='KeyG')toggleFormation();else if(e.code==='Escape')togglePause();return;}
  if(S.phase==='title'){if(e.code==='Escape'&&MENU!=='main')showTitle();return;}
  if(e.code==='F11'&&!NATIVE){e.preventDefault();toggleFS();return;}
  const k=KMAP[e.code];
  if(k&&!ov){K[k]=true;e.preventDefault();if(k==='attack'&&!e.repeat)tryAttack('key');}
  if(e.repeat)return;
  if(e.code==='Escape'){if(armed){setArmed(null);return;}if(S.paused&&MENU==='settings'){overlay(pauseHTML());MENU='pause';return;}togglePause();return;}
  if(S.paused||ov)return;
  if(e.code==='KeyB'){toggleFieldShop();return;}
  if(e.code==='KeyC'){if(S.pending>0&&S.phase==='battle'&&!S.modal)openLevelUp();return;}
  if(/^Digit[1-3]$/.test(e.code)&&S.phase==='battle'){buildTower(TW_KEYS[+e.code.slice(5)-1]);return;}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')tryDash();
  else if(e.code==='KeyT')cycleSpeed();
  else if(e.code==='KeyG')toggleFormation();
  else if(e.code==='KeyM'){AU.muted=!AU.muted;if(AU.out)AU.out.gain.value=AU.muted?0:P.settings.master;toast(AU.muted?'Sound muted (M)':'Sound on');}
  else if(e.code==='KeyQ')triggerAbility('q');
  else if(e.code==='KeyE')triggerAbility('e');
  else if(e.code==='KeyR')triggerAbility('shock');
  else if(e.code==='KeyF')triggerAbility('f');
});

/* ================= gamepad ================= */
const PAD={mx:0,my:0,fire:false,aiming:false,prev:[],connected:false};
const PADNAV={focus:null,rep:0};
window.addEventListener('gamepadconnected',()=>{PAD.connected=true;toast('🎮 Controller connected','good');});
window.addEventListener('gamepaddisconnected',()=>{PAD.connected=false;PAD.mx=PAD.my=0;PAD.fire=false;});
function padFocusables(){return [...document.querySelectorAll('#overlay [data-act]')].filter(el=>!el.disabled&&el.offsetParent!==null);}
function padMove(dx,dy){
  const els=padFocusables();if(!els.length)return;
  let cur=PADNAV.focus&&els.includes(PADNAV.focus)?PADNAV.focus:null;
  if(!cur){cur=els[0];}
  else{const r0=cur.getBoundingClientRect(),c0={x:r0.left+r0.width/2,y:r0.top+r0.height/2};let best=null,bs=1e9;
    for(const el of els){if(el===cur)continue;const r=el.getBoundingClientRect(),cx=r.left+r.width/2-c0.x,cy=r.top+r.height/2-c0.y;const along=cx*dx+cy*dy;if(along<=4)continue;const perp=Math.abs(cx*dy-cy*dx);const sc=along+perp*2.2;if(sc<bs){bs=sc;best=el;}}
    if(best)cur=best;}
  document.querySelectorAll('.gpfocus').forEach(el=>el.classList.remove('gpfocus'));
  cur.classList.add('gpfocus');PADNAV.focus=cur;AU.click();
}
let PADOK=true;
function getPads(){if(!PADOK||!navigator.getGamepads)return [];try{return [...(navigator.getGamepads()||[])];}catch(e){PADOK=false;return [];}}
function pollPad(dt){
  if(!PADOK)return;
  const gp=getPads().find(g=>g&&g.connected);if(!gp){if(PAD.connected){PAD.mx=PAD.my=0;PAD.fire=false;}return;}
  PAD.connected=true;
  const b=i=>gp.buttons[i]&&gp.buttons[i].pressed, pr=i=>b(i)&&!PAD.prev[i];
  const ax=i=>{const v=gp.axes[i]||0;return Math.abs(v)<0.18?0:v;};
  const ov=!$('#overlay').classList.contains('hidden');
  if(ov){
    PAD.mx=PAD.my=0;PAD.fire=false;
    let dx=ax(0),dy=ax(1);if(b(14))dx=-1;if(b(15))dx=1;if(b(12))dy=-1;if(b(13))dy=1;
    PADNAV.rep-=dt;
    if((Math.abs(dx)>0.5||Math.abs(dy)>0.5)){if(PADNAV.rep<=0){PADNAV.rep=0.22;Math.abs(dx)>Math.abs(dy)?padMove(Math.sign(dx),0):padMove(0,Math.sign(dy));}}else PADNAV.rep=0;
    if(pr(0)){const f=PADNAV.focus;if(f&&document.body.contains(f))f.click();else padMove(0,1);}
    if(pr(1)){const back=document.querySelector('#overlay [data-act="back"],#overlay [data-act="resume"],#overlay [data-act="pauseMenu"]');if(back)back.click();}
    if(pr(9)){if(S.paused)resume();else if(S.phase==='shop')startWave();}
  }else if(canAct()){
    PAD.mx=ax(0);PAD.my=ax(1);
    const rx=ax(2),ry=ax(3),hr=F.hero;
    if(hr&&Math.hypot(rx,ry)>0.3){PAD.aiming=true;F.mouse.inside=true;F.mouseT=performance.now();const l=Math.hypot(rx,ry);F.mouse.x=hr.x+rx/l*220;F.mouse.y=hr.y-24+ry/l*220;}
    else if(PAD.aiming&&Math.hypot(rx,ry)<0.15)PAD.aiming=false;
    PAD.fire=b(7)||b(0)||(PAD.aiming&&Math.hypot(rx,ry)>0.6);
    if(pr(4)||pr(1))tryDash();
    const aimX=F.mouse.x,aimY=F.mouse.y,padCast=k=>{if(S.cd[k]>0||(k!=='shock'&&!skillOf(k)))return;castAbility(k,needsTarget(k)?aimX:undefined,needsTarget(k)?aimY:undefined);};
    if(pr(2))padCast('q');
    if(pr(3))padCast('e');
    if(pr(5))padCast('shock');
    if(pr(6))padCast('f');
    if(pr(8))toggleFormation();
    if(pr(9))togglePause();
  }
  PAD.prev=gp.buttons.map(x=>x.pressed);
}

/* ================= loop ================= */
let last=performance.now(),hudAcc=0,fpsAcc=0,fpsN=0;
const PERF={fps:60};
let FRAMEERR=0;
function frame(now){
  try{frameBody(now);}catch(e){if(FRAMEERR++<3)console.warn('frame error',e);requestAnimationFrame(frame);}
}
function frameBody(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  fpsAcc+=dt;fpsN++;if(fpsAcc>=1){PERF.fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;}
  pollPad(dt);
  if(TEST.turbo){for(let i=0;i<TEST.turbo;i++){if(S.paused||S.modal)break;F.hitStop=0;update(1/60);}hudAcc+=dt;if(hudAcc>0.5){hudAcc=0;renderHUD();}requestAnimationFrame(frame);return;}
  if(!S.paused&&!S.modal){
    if(F.hitStop>0)F.hitStop-=dt;
    else{const sp=(S.phase==='battle'||S.phase==='collect')?S.speed:1,total=dt*sp,steps=Math.max(1,Math.ceil(total/(1/60))),h=total/steps;for(let i=0;i<steps;i++){if(S.paused||S.modal)break;update(h);}}
  }
  const ovOpen=!$('#overlay').classList.contains('hidden');
  if(!ovOpen||(F.rc=(F.rc||0)+1)%(S.phase==='title'?1:6)===0)render();
  hudAcc+=dt;if(hudAcc>0.07){hudAcc=0;renderHUD();}
  requestAnimationFrame(frame);
}
